name: Release Plugin

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read plugin id and version
        id: info
        run: |
          echo "id=$(jq -r '.id' manifest.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r '.version' manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches manifest.json
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          if [ "$TAG_VERSION" != "${{ steps.info.outputs.version }}" ]; then
            echo "Tag v$TAG_VERSION doesn't match manifest version ${{ steps.info.outputs.version }}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test
      - run: yarn build

      - name: Create zip
        id: zip
        run: |
          ZIP="${{ steps.info.outputs.id }}-${{ steps.info.outputs.version }}.zip"
          zip -r "$ZIP" dist/ manifest.json LICENSE README.md -x "dist/**/*.map"
          echo "name=$ZIP" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: v${{ steps.info.outputs.version }}
          files: |
            ${{ steps.zip.outputs.name }}
            manifest.json
