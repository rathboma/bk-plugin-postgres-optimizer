name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["13", "14", "15", "16", "17", "18"]
    env:
      PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
      - name: Start PostgreSQL ${{ matrix.postgres }}
        run: |
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 5432:5432 \
            postgres:${{ matrix.postgres }} \
            -c shared_preload_libraries=pg_stat_statements -c track_io_timing=on
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U postgres && break
            sleep 1
          done
      - name: Install hypopg
        # Validation of index suggestions is only tested when hypopg is available.
        continue-on-error: true
        run: |
          docker exec pg bash -c "apt-get update -qq && apt-get install -y -qq postgresql-${{ matrix.postgres }}-hypopg"
      - run: yarn install --frozen-lockfile
      - run: yarn test:integration
