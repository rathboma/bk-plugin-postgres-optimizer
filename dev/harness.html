<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Optimizer dev harness</title>
    <style>
      body { margin: 0; font: 13px system-ui, sans-serif; background: #111; color: #ddd; display: flex; flex-direction: column; height: 100vh; }
      body.light { background: #eee; color: #222; }
      #bar { display: flex; gap: 12px; align-items: center; padding: 6px 10px; border-bottom: 1px solid #333; }
      #bar .grow { flex: 1; }
      iframe { flex: 1; border: 0; width: 100%; }
      #results { max-height: 30vh; overflow: auto; border-top: 1px solid #333; display: none; }
      #results table { border-collapse: collapse; font: 12px ui-monospace, monospace; }
      #results td, #results th { border: 1px solid #333; padding: 2px 6px; white-space: nowrap; max-width: 400px; overflow: hidden; text-overflow: ellipsis; }
      #toasts { position: fixed; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
      .toast { background: #333; color: #fff; padding: 8px 12px; border-radius: 6px; max-width: 480px; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <div id="bar">
      <strong>Beekeeper Studio (mock host)</strong>
      <span class="grow"></span>
      <label><input type="checkbox" id="light" /> Light theme</label>
    </div>
    <iframe id="plugin" title="plugin"></iframe>
    <div id="results"></div>
    <div id="toasts"></div>
    <script type="module">
      const params = new URLSearchParams(location.search);
      const iframe = document.getElementById("plugin");
      const info = await fetch("/api/info").then((r) => r.json());
      let viewState = JSON.parse(sessionStorage.getItem("viewState") ?? "null");

      const dark = {
        "--font-size": "13px",
        "--font-family": "system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif",
        "--font-family-mono": "ui-monospace, Menlo, Consolas, monospace",
        "--theme-bg": "#181818", "--theme-base": "#fff", "--theme-primary": "#fad83b", "--theme-secondary": "#4ad0ff",
        "--text-dark": "rgba(255,255,255,0.87)", "--text": "rgba(255,255,255,0.67)", "--text-light": "rgba(255,255,255,0.57)", "--text-lighter": "rgba(255,255,255,0.37)",
        "--brand-info": "#4ad0ff", "--brand-success": "#15db95", "--brand-warning": "#ff8d21", "--brand-danger": "#ff5d59", "--brand-pink": "#ff78f7",
        "--border-color": "rgba(255,255,255,0.1)", "--query-editor-bg": "#090909",
        "--bks-text-editor-keyword-fg-color": "#ff78f7", "--bks-text-editor-string-fg-color": "#fad83b", "--bks-text-editor-number-fg-color": "#fad83b",
      };
      const light = {
        ...dark,
        "--theme-bg": "#f8f8f8", "--theme-base": "black", "--theme-primary": "#f2c90b", "--theme-secondary": "#0099ff",
        "--text-dark": "rgba(0,0,0,0.87)", "--text": "rgba(0,0,0,0.67)", "--text-light": "rgba(0,0,0,0.57)", "--text-lighter": "rgba(0,0,0,0.37)",
        "--brand-info": "#3498db", "--brand-warning": "#dc700c", "--brand-pink": "#ff00f0",
        "--border-color": "rgba(0,0,0,0.15)", "--query-editor-bg": "white",
        "--bks-text-editor-keyword-fg-color": "#ff00f0", "--bks-text-editor-string-fg-color": "#1a9c3a", "--bks-text-editor-number-fg-color": "#c27d00",
      };
      const theme = () => {
        const isLight = document.getElementById("light").checked;
        document.body.classList.toggle("light", isLight);
        const vars = isLight ? light : dark;
        return { type: isLight ? "light" : "dark", palette: {}, cssString: Object.entries(vars).map(([k, v]) => `${k}: ${v};`).join("") };
      };
      if (params.get("theme") === "light") document.getElementById("light").checked = true;
      theme();
      document.getElementById("light").addEventListener("change", () => {
        iframe.contentWindow.postMessage({ name: "themeChanged", args: theme() }, "*");
      });

      function toast(text) {
        const el = document.createElement("div");
        el.className = "toast";
        el.textContent = text;
        document.getElementById("toasts").append(el);
        setTimeout(() => el.remove(), 4000);
      }

      function showTable(results) {
        const box = document.getElementById("results");
        const r = results[0];
        const cols = r.fields.map((f) => f.name);
        const esc = (v) => String(v ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[c]);
        box.innerHTML = `<table><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${r.rows
          .map((row) => `<tr>${cols.map((c) => `<td>${esc(row[c])}</td>`).join("")}</tr>`)
          .join("")}</table>`;
        box.style.display = "block";
      }

      const handlers = {
        getConnectionInfo: () => ({
          connectionType: "postgresql", databaseType: "postgresql", id: 1, workspaceId: 0,
          connectionName: "dev", databaseName: info.databaseName, defaultSchema: "public",
          readOnlyMode: params.get("readonly") === "1",
        }),
        getAppInfo: () => ({ version: "6.1.5", theme: theme() }),
        getViewContext: () =>
          params.get("sql")
            ? { command: "analyze-query", params: { selectedText: params.get("sql") } }
            : { command: "open-optimizer" },
        getViewState: () => viewState,
        setViewState: ({ state }) => { viewState = state; sessionStorage.setItem("viewState", JSON.stringify(state)); },
        getData: ({ key }) => JSON.parse(localStorage.getItem(`bks:${key}`) ?? "null"),
        setData: ({ key, value }) => localStorage.setItem(`bks:${key}`, JSON.stringify(value)),
        runQuery: async ({ query }) => {
          const res = await fetch("/api/query", { method: "POST", body: JSON.stringify({ query }) });
          const body = await res.json();
          if (!res.ok) throw new Error(body.error);
          return body;
        },
        expandTableResult: ({ results }) => showTable(results),
        setTabTitle: ({ title }) => { document.title = title; },
        openTab: (args) => toast(`openTab(${args.type})\n${args.query ?? args.table ?? ""}`),
        openExternal: ({ link }) => toast(`openExternal: ${link}`),
        "clipboard.writeText": ({ text }) => toast(`Copied ${text.length} characters`),
        "noty.success": ({ message }) => toast(message),
        "noty.info": ({ message }) => toast(message),
        "noty.warning": ({ message }) => toast(message),
        "noty.error": ({ message }) => toast(`Error: ${message}`),
        confirm: ({ title, message }) => window.confirm(`${title ?? ""}\n${message ?? ""}`),
      };

      window.addEventListener("message", async (event) => {
        if (event.source !== iframe.contentWindow) return;
        const { id, name, args } = event.data ?? {};
        if (!id) return; // notifications from the plugin (window events, errors)
        try {
          const handler = handlers[name];
          if (!handler) throw new Error(`Unknown request: ${name}`);
          const result = await handler(args ?? {});
          iframe.contentWindow.postMessage({ id, result }, "*");
        } catch (e) {
          iframe.contentWindow.postMessage({ id, error: { message: e.message } }, "*");
        }
      });

      iframe.src = "/plugin/index.html";
    </script>
  </body>
</html>
